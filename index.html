<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réponse Éclair</title>
    <meta
      name="description"
      content="Vos demandes classées par gravité réelle, pas par ordre d'arrivée."
    />

    <!-- Ajout à l'écran d'accueil (case E2 du cahier).
         Le manifeste sert à Android, apple-touch-icon à iOS qui l'ignore.
         theme-color colore la barre du navigateur, assorti à l'en-tête. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Le manifeste déclare display: standalone, et iOS 16.4+ le respecte.
         Les iPhone plus anciens l'ignorent : sans ces deux lignes, l'application
         ajoutée à l'écran d'accueil s'ouvre AVEC la barre d'adresse Safari —
         c'est-à-dire pas comme une application. `mobile-web-app-capable` est le
         nom standard ; le préfixé `apple-` reste nécessaire pour les vieux iOS. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
